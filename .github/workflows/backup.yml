name: GitHub Backup System

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"
      timezone: "Asia/Tokyo"

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install google-api-python-client
          pip install google-auth-oauthlib

      - name: Restore Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          mkdir -p config
          printf '%s' "$GOOGLE_CREDENTIALS" > config/credentials.json
          printf '%s' "$GOOGLE_TOKEN" > config/token.json

      - name: Run backup
        run: python sync/main.py